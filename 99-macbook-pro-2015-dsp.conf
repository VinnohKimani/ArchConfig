# MacBook Pro 13" (Early 2015 - MacBookPro12,1) Cirrus Logic CS4208 Acoustic DSP
# Native PipeWire 8-Band Parametric Equalizer & Speaker Mastering Chain
# Installed at: ~/.config/pipewire/pipewire.conf.d/99-macbook-pro-2015-dsp.conf

context.modules = [
    { name = libpipewire-module-filter-chain
        args = {
            node.description = "MacBook Pro 2015 Enhanced Speakers"
            media.name       = "MacBook Pro 2015 Enhanced Speakers"
            filter.graph = {
                nodes = [
                    # 1. Sub-bass protection high-pass (prevents cone distortion below 50Hz)
                    {
                        type    = builtin
                        name    = mbp_hp_sub
                        label   = bq_highpass
                        control = { "Freq" = 50.0 "Q" = 0.707 "Gain" = 0.0 }
                    }
                    # 2. Deep bass enclosure resonance boost (85 Hz)
                    {
                        type    = builtin
                        name    = mbp_bass_deep
                        label   = bq_peaking
                        control = { "Freq" = 85.0 "Q" = 1.1 "Gain" = 4.5 }
                    }
                    # 3. Upper-bass punch & warmth (160 Hz)
                    {
                        type    = builtin
                        name    = mbp_bass_warmth
                        label   = bq_peaking
                        control = { "Freq" = 160.0 "Q" = 1.2 "Gain" = 3.5 }
                    }
                    # 4. Lower-midrange body (320 Hz)
                    {
                        type    = builtin
                        name    = mbp_low_mid
                        label   = bq_peaking
                        control = { "Freq" = 320.0 "Q" = 1.4 "Gain" = 1.5 }
                    }
                    # 5. Center vocal presence (1000 Hz)
                    {
                        type    = builtin
                        name    = mbp_mid_vocal
                        label   = bq_peaking
                        control = { "Freq" = 1000.0 "Q" = 1.2 "Gain" = 0.5 }
                    }
                    # 6. Tame aluminum chassis boxiness (2800 Hz)
                    {
                        type    = builtin
                        name    = mbp_upper_mid_cut
                        label   = bq_peaking
                        control = { "Freq" = 2800.0 "Q" = 1.5 "Gain" = -2.0 }
                    }
                    # 7. Eliminate metallic speaker grill harshness (4500 Hz)
                    {
                        type    = builtin
                        name    = mbp_harsh_cut
                        label   = bq_peaking
                        control = { "Freq" = 4500.0 "Q" = 1.8 "Gain" = -2.5 }
                    }
                    # 8. High-frequency air, detail & sparkle (9500 Hz)
                    {
                        type    = builtin
                        name    = mbp_treble_air
                        label   = bq_highshelf
                        control = { "Freq" = 9500.0 "Q" = 0.8 "Gain" = 3.0 }
                    }
                ]
                links = [
                    { output = "mbp_hp_sub:Out"        input = "mbp_bass_deep:In" }
                    { output = "mbp_bass_deep:Out"     input = "mbp_bass_warmth:In" }
                    { output = "mbp_bass_warmth:Out"   input = "mbp_low_mid:In" }
                    { output = "mbp_low_mid:Out"       input = "mbp_mid_vocal:In" }
                    { output = "mbp_mid_vocal:Out"     input = "mbp_upper_mid_cut:In" }
                    { output = "mbp_upper_mid_cut:Out" input = "mbp_harsh_cut:In" }
                    { output = "mbp_harsh_cut:Out"     input = "mbp_treble_air:In" }
                ]
            }
            audio.channels = 2
            audio.position = [ FL FR ]
            capture.props = {
                node.name      = "effect_input.macbook_dsp"
                media.class    = Audio/Sink
                priority.driver  = 2000
                priority.session = 2000
            }
            playback.props = {
                node.name      = "effect_output.macbook_dsp"
                node.passive   = true
                target.object  = "alsa_output.pci-0000_00_1b.0.analog-stereo"
            }
        }
    }
]

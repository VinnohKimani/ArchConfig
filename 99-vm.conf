# In-memory ZRAM aggressive swap (protects executable app code cache)
vm.swappiness = 150
vm.page-cluster = 0

# Prevent 1.5GB dirty page accumulation stalls during disk/build activity
vm.dirty_ratio = 10
vm.dirty_background_ratio = 5

# Balanced inode/dentry metadata reclamation
vm.vfs_cache_pressure = 100

# Proactive background memory reclamation (eliminates direct-reclaim UI freezes)
vm.watermark_boost_factor = 0
vm.watermark_scale_factor = 125

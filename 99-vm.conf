# Balanced ZRAM + SSD swap tuning
# swappiness = 60 prevents premature memory eviction and CPU compression stalls during video playback
vm.swappiness = 60
vm.page-cluster = 0

# Prevent dirty page accumulation stalls during disk/build activity
vm.dirty_ratio = 10
vm.dirty_background_ratio = 5

# Balanced inode/dentry metadata reclamation
vm.vfs_cache_pressure = 100

# Proactive background memory reclamation without aggressive kswapd thrashing
vm.watermark_boost_factor = 0
vm.watermark_scale_factor = 20

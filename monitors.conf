# MacBook Pro 2015 Retina Display (2560x1600) HiDPI Configuration
monitor=eDP-1,2560x1600@60,0x0,1.6

# External HDMI & Mini-DisplayPort Monitors / Projectors
# Use integer scale 1 (not 1.5) to prevent KMS page-flip errors and blurry scaling
monitor=HDMI-A-1,preferred,auto,1
monitor=HDMI-A-2,preferred,auto,1
monitor=DP-1,preferred,auto,1
monitor=DP-2,preferred,auto,1

# Generic fallback for any other external display
monitor=,preferred,auto,1


# macOS Sonoma Style Hyprlock Layout
# Designed for MacBook Pro Retina (1600x1000 / 2560x1600)
# Dynamic Wallbash Theming & Glassmorphism

$fontFamily = SF Pro Display
$fontFamilyClock = SF Pro Display Thin

background {
    monitor =
    path = $BACKGROUND_PATH
    blur_passes = 3
    blur_size = 5
    noise = 0.015
    contrast = 0.95
    brightness = 0.85
    vibrancy = 0.25
    vibrancy_darkness = 0.1
}

general {
    no_fade_in = false
    grace = 0
    disable_loading_bar = true
}

# TIME (Large Apple-style Clock)
label {
    monitor =
    text = cmd[update:1000] echo "<span>$(date +"%H:%M")</span>"
    color = rgba(255, 255, 255, 0.95)
    font_size = 90
    font_family = $fontFamilyClock
    position = 0, 160
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 4
    shadow_color = rgba(0, 0, 0, 0.3)
}

# DATE
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%A, %B %d")"
    color = rgba(255, 255, 255, 0.85)
    font_size = 20
    font_family = $fontFamily
    position = 0, 85
    halign = center
    valign = center
    shadow_passes = 1
    shadow_size = 2
    shadow_color = rgba(0, 0, 0, 0.3)
}

# USER PROFILE AVATAR
image {
    monitor =
    path = $PROFILE_IMAGE
    border_size = 3
    border_color = rgba(255, 255, 255, 0.35)
    size = 90
    rounding = -1
    position = 0, -20
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 4
}

# USER GREETING / NAME
label {
    monitor =
    text = cmd[update:60000] $GREET_TEXT
    color = rgba(255, 255, 255, 0.9)
    font_size = 15
    font_family = $fontFamily Bold
    position = 0, -85
    halign = center
    valign = center
}

# INPUT FIELD (macOS Glass Pill)
input-field {
    monitor =
    size = 260, 46
    outline_thickness = 1
    dots_size = 0.25
    dots_spacing = 0.3
    dots_center = true
    outer_color = rgba(255, 255, 255, 0.25)
    inner_color = rgba(255, 255, 255, 0.15)
    font_color = rgb(255, 255, 255)
    fade_on_empty = false
    rounding = 23
    font_family = $fontFamily
    placeholder_text = <i><span foreground="##ffffffaa">Touch ID or Enter Password</span></i>
    hide_input = false
    position = 0, -145
    halign = center
    valign = center
    check_color = $wallbash_pry2_rgba
    fail_color = rgb(235, 77, 75)
    fail_text = <i>Password Incorrect</i>
    fail_transition = 200
}

# BATTERY WIDGET (Top Right)
label {
    monitor =
    text = cmd[update:5000] echo "$BATTERY_ICON $BATTERY_PERCENT"
    color = rgba(255, 255, 255, 0.75)
    font_size = 13
    font_family = $fontFamily
    position = -30, -25
    halign = right
    valign = top
}

# MEDIA PLAYING WIDGET (Bottom Center)
label {
    monitor =
    text = cmd[update:1000] echo "$MPRIS_TEXT"
    color = rgba(255, 255, 255, 0.65)
    font_size = 12
    font_family = $fontFamily
    position = 0, 30
    halign = center
    valign = bottom
}

# Minimalist Stacked Clock Hyprlock Layout
# Bold Architectural Typography with Wallbash Accents

$fontFamily = JetBrainsMono Nerd Font

background {
    monitor =
    path = $BACKGROUND_PATH
    blur_passes = 2
    blur_size = 6
    contrast = 1.1
    brightness = 0.75
}

general {
    no_fade_in = false
    grace = 0
    disable_loading_bar = true
}

# STACKED HOUR
label {
    monitor =
    text = cmd[update:1000] date +"%H"
    color = $wallbash_pry2_rgba
    font_size = 130
    font_family = $fontFamily ExtraBold
    position = 0, 150
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 6
}

# STACKED MINUTE
label {
    monitor =
    text = cmd[update:1000] date +"%M"
    color = rgba(255, 255, 255, 0.85)
    font_size = 130
    font_family = $fontFamily ExtraBold
    position = 0, 30
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 6
}

# DATE & STATUS
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%A, %d %B")  •  $BATTERY_ICON $BATTERY_PERCENT"
    color = rgba(255, 255, 255, 0.7)
    font_size = 14
    font_family = $fontFamily Bold
    position = 0, -80
    halign = center
    valign = center
}

# FLOATING INPUT PILL
input-field {
    monitor =
    size = 280, 48
    outline_thickness = 2
    dots_size = 0.22
    dots_spacing = 0.25
    dots_center = true
    outer_color = $wallbash_pry2_rgba
    inner_color = rgba(20, 20, 20, 0.5)
    font_color = rgb(255, 255, 255)
    fade_on_empty = false
    rounding = 12
    font_family = $fontFamily
    placeholder_text = <i><span foreground="##ffffff88">Enter password...</span></i>
    hide_input = false
    position = 0, -145
    halign = center
    valign = center
    check_color = $wallbash_pry3_rgba
    fail_color = rgb(231, 76, 60)
    fail_text = <i>Access Denied ($ATTEMPTS)</i>
    fail_transition = 250
}

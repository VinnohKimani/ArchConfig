# Cyberpunk Tech HUD Hyprlock Layout
# Monospace Terminal Interface with Neon Glow & System Status

$fontFamily = JetBrainsMono Nerd Font

background {
    monitor =
    path = $BACKGROUND_PATH
    blur_passes = 3
    blur_size = 4
    contrast = 1.2
    brightness = 0.7
}

general {
    no_fade_in = false
    grace = 0
    disable_loading_bar = true
}

# TOP STATUS BAR
label {
    monitor =
    text = cmd[update:5000] echo "[ SECURE GATEWAY // HOST: $(hostname) ] [ BATTERY: $BATTERY_PERCENT $BATTERY_ICON ]"
    color = $wallbash_pry2_rgba
    font_size = 12
    font_family = $fontFamily Bold
    position = 40, -25
    halign = left
    valign = top
}

# SYSTEM LOCKED BANNER
label {
    monitor =
    text = // SYSTEM_LOCKED //
    color = $wallbash_pry1_rgba
    font_size = 14
    font_family = $fontFamily ExtraBold
    position = 0, 150
    halign = center
    valign = center
}

# HUD TIME
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M:%S")"
    color = rgba(255, 255, 255, 0.95)
    font_size = 72
    font_family = $fontFamily ExtraBold
    position = 0, 85
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 5
    shadow_color = $wallbash_pry2_rgba
}

# HUD DATE & UPTIME
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%A | %Y-%m-%d") | UPTIME: $(uptime -p | sed 's/up //')"
    color = rgba(255, 255, 255, 0.65)
    font_size = 13
    font_family = $fontFamily
    position = 0, 15
    halign = center
    valign = center
}

# HUD INPUT FIELD
input-field {
    monitor =
    size = 320, 50
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.3
    dots_center = true
    outer_color = $wallbash_pry2_rgba
    inner_color = rgba(10, 15, 20, 0.75)
    font_color = $wallbash_pry3_rgba
    fade_on_empty = false
    rounding = 4
    font_family = $fontFamily
    placeholder_text = <i><span foreground="##00ffff88">> AUTHENTICATE_USER:</span></i>
    hide_input = false
    position = 0, -65
    halign = center
    valign = center
    check_color = $wallbash_pry3_rgba
    fail_color = rgb(255, 50, 50)
    fail_text = <i>ACCESS_DENIED // RETRY</i>
    fail_transition = 200
}

# FOOTER MEDIA / NOTICE
label {
    monitor =
    text = cmd[update:1000] echo "NODE: eDP-1 // CIRRUS LOGIC AUDIO ACTIVE // ARCH LINUX HYPRLAND"
    color = rgba(255, 255, 255, 0.35)
    font_size = 11
    font_family = $fontFamily
    position = 0, 25
    halign = center
    valign = bottom
}
